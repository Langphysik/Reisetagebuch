<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reisetagebuch</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#33475B">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --paper:#EFE7D6;
    --card:#F7F2E7;
    --ink:#2B2620;
    --ink-soft:#6b6354;
    --route:#33475B;
    --route-soft:#93A4B2;
    --stamp:#B5652D;
    --stamp-soft:#e7c9ae;
    --line:rgba(43,38,32,0.14);
    --shadow: 0 6px 18px rgba(43,38,32,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(43,38,32,0.05) 1px, transparent 0);
    background-size: 18px 18px;
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:760px;margin:0 auto;padding:20px 16px 80px;}
  h1,h2,h3{font-family:'Fraunces', serif; margin:0; letter-spacing:-0.01em;}
  .eyebrow{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft);}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;gap:8px;}
  .topbar h1{font-size:22px; font-weight:700;}
  .back-btn{background:none;border:none;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--route);cursor:pointer;padding:6px 0;display:flex;align-items:center;gap:4px;}
  .btn{font-family:'Work Sans',sans-serif; font-weight:600; font-size:14px;border:none;border-radius:3px;padding:11px 18px;cursor:pointer;background:var(--route); color:var(--paper); letter-spacing:0.01em;}
  .btn:active{transform:translateY(1px);}
  .btn.ghost{background:transparent;color:var(--route);border:1.5px solid var(--route);}
  .btn.stamp{background:var(--stamp);color:#fff8f0;}
  .btn.small{padding:7px 12px;font-size:12.5px;}
  .btn:disabled{opacity:0.5;cursor:default;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .icon-btn{background:var(--card);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--ink-soft);flex:0 0 auto;}
  .trip-card{background:var(--card); border-radius:6px; box-shadow:var(--shadow);padding:18px 18px 16px; margin-bottom:14px; cursor:pointer; position:relative;border-left:4px solid var(--route);}
  .trip-card h3{font-size:19px;font-weight:600;}
  .trip-card .meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .mini-thread{display:flex;gap:5px;margin-top:12px;align-items:center;}
  .mini-dot{width:6px;height:6px;border-radius:50%;background:var(--route-soft);}
  .trip-card .card-actions{position:absolute; top:14px; right:14px; display:flex; align-items:center; gap:10px;}
  .trip-card .del{background:none;border:none;color:var(--ink-soft); opacity:0.55; cursor:pointer; font-size:13px;}
  .trip-card .color-btn{background:none;border:none;color:var(--ink-soft); opacity:0.55; cursor:pointer; font-size:14px; padding:0;}
  .color-picker-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .color-dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);cursor:pointer;padding:0;}
  .color-dot.active{border-color:var(--route); border-width:2.5px;}
  .empty{text-align:center; padding:50px 20px; color:var(--ink-soft);}
  .empty .glyph{font-size:30px;margin-bottom:10px;}
  .panel{background:var(--card); border-radius:6px; box-shadow:var(--shadow);padding:20px; margin-bottom:20px;}
  label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-soft); display:block; margin-bottom:6px;}
  input[type=text], input[type=date], input[type=password], textarea, select{width:100%; font-family:'Work Sans',sans-serif; font-size:15px; color:var(--ink);background:var(--paper); border:1px solid var(--line); border-radius:4px;padding:10px 12px; margin-bottom:16px;}
  textarea{resize:vertical; min-height:56px; font-family:'Source Serif 4', serif; font-size:15.5px;}
  .field-row{display:flex; gap:12px;}
  .field-row > div{flex:1;}
  .thread-wrap{overflow-x:auto; margin: 4px -16px 22px; padding: 10px 16px 6px;}
  .thread-track{display:flex;}
  .waypoint{position:relative; flex:0 0 62px; display:flex; flex-direction:column;align-items:center; cursor:pointer;}
  .waypoint:not(:last-child)::after{content:''; position:absolute; top:14px; left:calc(50% + 8px); width:46px; height:0;border-top:2px dashed var(--route-soft); z-index:0;}
  .waypoint-dot{position:relative; z-index:1; width:15px;height:15px;border-radius:50%;border:2px solid var(--route); background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:9px;}
  .waypoint.active .waypoint-dot{background:var(--route);}
  .waypoint-label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-top:6px; white-space:nowrap;}
  .waypoint-weather{font-size:13px; margin-top:2px;}
  .add-waypoint .waypoint-dot{border-style:dashed; color:var(--route);}
  .sticker-picker{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
  .sticker-chip{font-size:19px; background:var(--paper); border:1.5px solid var(--line); border-radius:6px; width:38px; height:38px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
  .sticker-chip.active{border-color:var(--route); background:var(--stamp-soft);}
  .entry-stickers{font-size:16px; letter-spacing:2px;}
  .photo-picker-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
  .photo-thumb{position:relative; width:78px; height:78px; border-radius:4px; overflow:hidden;box-shadow:0 2px 6px rgba(43,38,32,0.25); flex:0 0 auto;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .rm{position:absolute; top:2px; right:2px; background:rgba(43,38,32,0.65); color:#fff;border:none; border-radius:50%; width:19px;height:19px; font-size:11px; cursor:pointer; line-height:1;}
  .photo-thumb .mv{position:absolute; bottom:2px; background:rgba(247,242,231,0.9); color:var(--ink);border:none; width:19px;height:19px; font-size:11px; cursor:pointer; border-radius:3px;}
  .photo-thumb .mv.l{left:2px;} .photo-thumb .mv.r{right:2px;}
  .add-photo-btn{width:78px;height:78px;border-radius:4px;border:1.5px dashed var(--route-soft);background:none; color:var(--route); font-size:22px; cursor:pointer; flex:0 0 auto;}
  .status-line{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--stamp); margin:4px 0 10px; min-height:14px;}
  .entry-card{background:var(--card); border-radius:6px; box-shadow:var(--shadow);padding:22px 20px 20px; margin-bottom:22px; scroll-margin-top:16px;}
  .entry-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .stamp-badge{display:inline-flex; align-items:center; gap:8px;border:1.5px solid var(--stamp); color:var(--stamp); border-radius:30px;padding:5px 14px 5px 12px; font-family:'IBM Plex Mono',monospace; font-size:12px;transform:rotate(-1.2deg);}
  .entry-actions{display:flex;gap:6px;}
  .entry-text{font-family:'Source Serif 4', serif; font-size:16.5px; line-height:1.65; color:var(--ink);}
  .photo-mosaic{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-top:16px;}
  .photo-mosaic img{width:100%; height:100%; object-fit:cover; border-radius:2px; display:block;background:#fff; padding:5px 5px 16px; box-shadow:0 3px 8px rgba(43,38,32,0.22);}
  .photo-mosaic .ph{grid-column:span 3;}
  .photo-mosaic .ph.big{grid-column:span 4;}
  .photo-mosaic .ph.small{grid-column:span 2;}
  @media (max-width:520px){.photo-mosaic{grid-template-columns:repeat(2,1fr);}.photo-mosaic .ph, .photo-mosaic .ph.big, .photo-mosaic .ph.small{grid-column:span 1;}}
  .inline-photos{display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 16px;}
  .inline-photos img{flex:1 1 140px; max-width:100%; height:150px; object-fit:cover; border-radius:2px; display:block; background:#fff; padding:5px 5px 14px; box-shadow:0 3px 8px rgba(43,38,32,0.22);}
  .loading-row{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:10px 0;}
  .spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--route-soft);border-top-color:var(--route);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .export-row{display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .settings-btn{position:absolute; top:20px; right:16px; background:none;border:none;color:var(--ink-soft);font-size:18px;cursor:pointer;}
  .hint{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); line-height:1.6; margin-top:-8px; margin-bottom:16px;}
  .custom-format-row{display:flex; gap:10px; align-items:center; margin-bottom:16px;}
  .custom-format-row input{margin-bottom:0; width:80px;}
  .map-overlay{position:fixed; inset:0; background:var(--paper); z-index:1000; display:flex; flex-direction:column;}
  .map-overlay-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--card); box-shadow:var(--shadow); z-index:2;}
  #trip-map{flex:1;}
  .leaflet-popup-content{font-family:'Work Sans',sans-serif; font-size:13px;}
  .leaflet-popup-content b{font-family:'IBM Plex Mono',monospace; font-size:11px;}
  ::selection{background:var(--stamp-soft);}
  a{color:var(--route);}
  .day-nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -4px 14px rgba(43,38,32,0.18);z-index:50;transform:translateY(100%);transition:transform 0.25s ease;padding:8px 12px calc(8px + env(safe-area-inset-bottom));}
  .day-nav.visible{transform:translateY(0);}
  .day-nav-track{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .day-nav-track::-webkit-scrollbar{display:none;}
  .day-nav-item{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 13px;cursor:pointer;white-space:nowrap;}
  .day-nav-item.active{background:var(--route);color:var(--paper);border-color:var(--route);}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  // ---------- category definitions (fixed) ----------
  const WEATHER = [
    {v:'', icon:'—', label:'– keine Angabe –'},
    {v:'sonnig', icon:'☀️', label:'Sonnig'},
    {v:'wolkig', icon:'⛅', label:'Wolkig'},
    {v:'bewoelkt', icon:'☁️', label:'Bewölkt'},
    {v:'regen', icon:'🌧️', label:'Regen'},
    {v:'gewitter', icon:'⛈️', label:'Gewitter'},
    {v:'schnee', icon:'❄️', label:'Schnee'},
    {v:'wind', icon:'🌬️', label:'Windig'},
    {v:'nebel', icon:'🌫️', label:'Neblig'}
  ];
  function weatherIcon(v){ const w = WEATHER.find(w=>w.v===v); return (w && w.v) ? w.icon : ''; }
  function weatherLabel(v){ const w = WEATHER.find(w=>w.v===v); return w ? w.label : ''; }

  const STICKERS = ['☀️','⛅','🌧️','⛈️','❄️','🌈','⛰️','🏔️','🌊','🏜️','🌲','🏖️','🌅','🦭','🐬','🐋','🐄','🐐','🦌','🐦','🕊️','🐕','🚵','🚴','🥾','🏃','🏊','🏋️','⛵','🚄','⛪','🧖','♨️','🍕','🥗','🐟','🍨','🍝','😄','🥵','🥶','❤️','💑'];

  const TRIP_COLORS = ['#F7F2E7','#F6DCC8','#F9E4A8','#DCE8C4','#C9E3DD','#CFE0F0','#DAD3EC','#F0D3DE'];

  const CATEGORIES = [
    {key:'essen', label:'Essen', placeholder:'Was hast du gegessen? Highlights, Restaurants, Spezialitäten …'},
    {key:'tiere', label:'Erlebnisse mit Tieren', placeholder:'Tieren begegnet? Was ist passiert?'},
    {key:'menschen', label:'Begegnungen mit Menschen', placeholder:'Interessante Begegnungen, Gespräche …'},
    {key:'orte', label:'Besuchte Orte', placeholder:'Ein Ort pro Zeile (erscheint dann auf der Karte). Bei mehrdeutigen Namen die Region dahinter ergänzen, z. B.:\nImst, Tirol\nMemminger Hütte, Österreich'},
    {key:'aktivitaet', label:'Aktivität', placeholder:'Was hast du unternommen? Strecke, Sport, Programm …'},
    {key:'weiteres', label:'Weiteres', placeholder:'Alles, was sonst noch dazugehört …'}
  ];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}); }
  function fmtDateShort(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ---------- storage: real browser localStorage (works once self-hosted) ----------
  function storeGet(key){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch(e){ console.error('storage get failed', e); return null; }
  }
  function storeSet(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch(e){ console.error('storage set failed (Speicher evtl. voll)', e); alert('Speichern fehlgeschlagen. Eventuell ist der lokale Speicher voll.'); return false; }
  }
  function storeDelete(key){ try{ localStorage.removeItem(key); }catch(e){} }

  // ---------- storage: photo bytes live in IndexedDB (much bigger quota than localStorage) ----------
  // entries in localStorage only ever hold {id,w,h,rotate} per photo; the actual base64 "data"
  // lives here, keyed by photo id, and gets merged back in by loadEntries().
  const PHOTO_DB_NAME = 'rtb_photos', PHOTO_DB_STORE = 'photos';
  let photoDbPromise = null;
  function openPhotoDb(){
    if(!window.indexedDB) return Promise.resolve(null);
    if(!photoDbPromise){
      photoDbPromise = new Promise((resolve)=>{
        try{
          const req = indexedDB.open(PHOTO_DB_NAME, 1);
          req.onupgradeneeded = ()=>{ req.result.createObjectStore(PHOTO_DB_STORE, {keyPath:'id'}); };
          req.onsuccess = ()=> resolve(req.result);
          req.onerror = ()=>{ console.error('IndexedDB konnte nicht geöffnet werden', req.error); resolve(null); };
        }catch(e){ console.error('IndexedDB nicht verfügbar', e); resolve(null); }
      });
    }
    return photoDbPromise;
  }
  async function photoPut(id, data){
    const db = await openPhotoDb();
    if(!db) return;
    return new Promise((resolve)=>{
      const tx = db.transaction(PHOTO_DB_STORE,'readwrite');
      tx.objectStore(PHOTO_DB_STORE).put({id, data});
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=>{ console.error('Foto speichern fehlgeschlagen', tx.error); resolve(); };
    });
  }
  async function photoDelete(id){
    const db = await openPhotoDb();
    if(!db) return;
    return new Promise((resolve)=>{
      const tx = db.transaction(PHOTO_DB_STORE,'readwrite');
      tx.objectStore(PHOTO_DB_STORE).delete(id);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> resolve();
    });
  }
  async function photoGetMany(ids){
    const out = {};
    const db = await openPhotoDb();
    if(!db || !ids.length) return out;
    return new Promise((resolve)=>{
      const tx = db.transaction(PHOTO_DB_STORE,'readonly');
      const store = tx.objectStore(PHOTO_DB_STORE);
      let remaining = ids.length;
      ids.forEach(id=>{
        const req = store.get(id);
        req.onsuccess = ()=>{ if(req.result) out[id] = req.result.data; if(--remaining===0) resolve(out); };
        req.onerror = ()=>{ if(--remaining===0) resolve(out); };
      });
    });
  }
  function stripPhotosForStorage(entries){
    return entries.map(en=> Object.assign({}, en, {
      photos: (en.photos||[]).map(p=> ({id:p.id, w:p.w, h:p.h, rotate:p.rotate, timeOfDay:p.timeOfDay, captureHour:p.captureHour}))
    }));
  }

  // ---------- state ----------
  let state = {
    view:'trips',
    trips: [],
    currentTripId: null,
    entries: {},
    editingEntryId: null,
    formPhotos: [],
    formFields: {},
    formCustomLabel:'', formCustomText:'',
    formDate:'',
    formGeneratedText:'',
    generating:false,
    showSettings:false,
    apiKey: '',
    colorPickerTripId: null
  };

  function loadTrips(){ state.trips = storeGet('trips') || []; }
  function saveTrips(){ storeSet('trips', state.trips); }
  async function loadEntries(tripId){
    const entries = (storeGet('entries:'+tripId) || []).sort((a,b)=>a.date.localeCompare(b.date));
    const idsToFetch = [];
    entries.forEach(en=> (en.photos||[]).forEach(p=>{
      if(!p.id) p.id = uid();               // legacy photo without id
      if(p.data === undefined) idsToFetch.push(p.id);
    }));
    if(idsToFetch.length){
      const fetched = await photoGetMany(idsToFetch);
      entries.forEach(en=> (en.photos||[]).forEach(p=>{
        if(p.data === undefined){ p.data = fetched[p.id] || null; p._fromDb = true; }
      }));
    }
    state.entries[tripId] = entries;
  }
  async function saveEntries(tripId){
    const entries = state.entries[tripId] || [];
    const puts = [];
    entries.forEach(en=> (en.photos||[]).forEach(p=>{
      if(!p._fromDb && p.data){ puts.push(photoPut(p.id, p.data).then(()=>{ p._fromDb = true; })); }
    }));
    await Promise.all(puts);
    storeSet('entries:'+tripId, stripPhotosForStorage(entries));
  }
  function loadApiKey(){ state.apiKey = localStorage.getItem('rtb_api_key') || ''; }
  function saveApiKey(k){ localStorage.setItem('rtb_api_key', k); state.apiKey = k; }

  // ---------- image compression ----------
  // reads the EXIF "DateTimeOriginal"/"DateTime" tag of a JPEG to get the capture hour,
  // so the photo can later be matched against times mentioned in the diary text (see chunkHour)
  function timeOfDayFromHour(h){
    if(h==null || isNaN(h)) return null;
    if(h>=5 && h<11) return 'morgen';
    if(h>=11 && h<14) return 'mittag';
    if(h>=14 && h<18) return 'nachmittag';
    if(h>=18 && h<22) return 'abend';
    return 'nacht';
  }
  function readExifIFD(view, tiffStart, ifdOffset, little){
    const count = view.getUint16(ifdOffset, little);
    const entries = {};
    for(let i=0;i<count;i++){
      const entryOffset = ifdOffset + 2 + i*12;
      entries[view.getUint16(entryOffset, little)] = {
        numValues: view.getUint32(entryOffset+4, little),
        valueOffset: entryOffset+8
      };
    }
    return entries;
  }
  function readExifAscii(view, tiffStart, entry, little){
    const byteLength = entry.numValues;
    const dataStart = byteLength<=4 ? entry.valueOffset : tiffStart + view.getUint32(entry.valueOffset, little);
    let str='';
    for(let i=0;i<byteLength-1;i++) str += String.fromCharCode(view.getUint8(dataStart+i));
    return str;
  }
  function exifCaptureHour(buffer){
    try{
      const view = new DataView(buffer);
      if(view.getUint16(0,false)!==0xFFD8) return null;
      let offset = 2;
      while(offset+4<=view.byteLength){
        const marker = view.getUint16(offset,false);
        if((marker & 0xFF00)!==0xFF00) break;
        const segLen = view.getUint16(offset+2,false);
        if(marker===0xFFE1){
          const segStart = offset+4;
          if(view.getUint32(segStart,false)!==0x45786966) return null; // not "Exif"
          const tiffStart = segStart+6;
          const little = view.getUint16(tiffStart,false)===0x4949;
          const ifd0Offset = tiffStart + view.getUint32(tiffStart+4, little);
          const ifd0 = readExifIFD(view, tiffStart, ifd0Offset, little);
          let dateStr = null;
          if(ifd0[0x8769]){
            const exifIfdOffset = tiffStart + view.getUint32(ifd0[0x8769].valueOffset, little);
            const exifIfd = readExifIFD(view, tiffStart, exifIfdOffset, little);
            const dateEntry = exifIfd[0x9003] || exifIfd[0x9004];
            if(dateEntry) dateStr = readExifAscii(view, tiffStart, dateEntry, little);
          }
          if(!dateStr && ifd0[0x0132]) dateStr = readExifAscii(view, tiffStart, ifd0[0x0132], little);
          const m = dateStr && dateStr.match(/\d{4}:\d{2}:\d{2} (\d{2}):(\d{2})/);
          return m ? parseInt(m[1],10) + parseInt(m[2],10)/60 : null;
        }
        offset += 2 + segLen;
      }
    }catch(e){ /* kein/kaputtes EXIF, einfach ignorieren */ }
    return null;
  }
  function readAndCompress(file){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = function(ev){
        const img = new Image();
        img.onload = async function(){
          const maxDim = 1100;
          let w = img.width, h = img.height;
          if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
          else if(h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img,0,0,w,h);
          const data = canvas.toDataURL('image/jpeg',0.72);
          let captureHour = null, timeOfDay = null;
          try{ captureHour = exifCaptureHour(await file.arrayBuffer()); timeOfDay = timeOfDayFromHour(captureHour); }catch(e){ /* ignore */ }
          resolve({data, w, h, rotate:(Math.random()*6-3).toFixed(1), timeOfDay, captureHour});
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function localTemplateText(f){
    const pieces = [];
    if(f.weather) pieces.push(`Das Wetter: ${weatherLabel(f.weather)}.`);

    if(f.orte) pieces.push(`Unterwegs habe ich diese Orte gesehen: ${f.orte.trim()}`);
    if(f.essen) pieces.push(`Kulinarisch war heute einiges dabei: ${f.essen.trim()}`);
    if(f.tiere) pieces.push(`Tierisch wurde es auch: ${f.tiere.trim()}`);
    if(f.menschen) pieces.push(`Ich bin auf interessante Menschen getroffen: ${f.menschen.trim()}`);
    if(f.weiteres) pieces.push(f.weiteres.trim());
    if(f.customLabel && f.customText) pieces.push(`${f.customLabel.trim()}: ${f.customText.trim()}`);
    return pieces.join(' ') || 'Kein Eintrag verfasst.';
  }

  async function generateDiaryText(f){

Wichtigste Regel: Jedes einzelne Detail aus jeder der folgenden Kategorien MUSS im Text vorkommen, auch Nebensächliches, Namen, Zahlen und Aufzählungen. Lass nichts weg, kürze nicht zusammen und fasse nicht mehrere genannte Dinge zu einem einzigen vagen Begriff zusammen. Erfinde umgekehrt keine zusätzlichen Fakten hinzu, die nicht genannt wurden. Leere Kategorien (die unten gar nicht auftauchen) einfach ignorieren. Die Textlänge richtet sich danach, wie viel Stoff da ist: lieber etwas länger und vollständig als kurz und lückenhaft.

${lines.join('\n')}

Schreibe nur den fertigen Tagebuchtext, ohne Anführungszeichen, ohne Vorrede, ohne Aufzählungszeichen — als zusammenhängenden Fließtext in ein bis drei Absätzen.`;

    try{

      ticking = false;

      dayNav.classList.toggle('visible', threshold < 0);

      let currentId = cards.length ? cards[0].id.slice(6) : null;
      for(const card of cards){

        if(isActive) activeEl = el;

      if(activeEl) activeEl.scrollIntoView({block:'nearest', inline:'center'});
    }
    function onScroll(){ if(!ticking){ ticking=true; requestAnimationFrame(updateNav); } }

    window.addEventListener('scroll', onScroll, {passive:true});
    window.addEventListener('resize', onScroll);
    tripScrollCleanup = ()=>{ window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); };
    updateNav();

  // German time-of-day keywords and a representative clock hour for each, used to match
  // text passages to photos taken around that time
  const TIME_KEYWORDS = {
    morgen: ['morgen','morgens','früh','frühstück','sonnenaufgang','vormittag'],
    mittag: ['mittag','mittags','mittagessen'],
    nachmittag: ['nachmittag','nachmittags'],
    abend: ['abend','abends','abendessen','dinner','sonnenuntergang'],
    nacht: ['nacht','nachts','mitternacht']
  };
  const BUCKET_HOUR = { morgen:8, mittag:12.5, nachmittag:15.5, abend:19.5, nacht:23 };

  // approximate clock hour (0..24, e.g. 15.5 for "15:30") a text chunk refers to:
  // first an explicit time like "15:00" / "15 Uhr" / "15.30 Uhr", otherwise a time-of-day keyword
  function chunkHour(text){
    const lower = text.toLowerCase();
    let m = lower.match(/\b(\d{1,2}):(\d{2})\b/) || lower.match(/\b(\d{1,2})\.(\d{2})\s*(?:uhr|h)\b/);
    if(m){ const hh=+m[1], mm=+m[2]; if(hh<24 && mm<60) return hh + mm/60; }
    m = lower.match(/\b(\d{1,2})\s*(?:uhr|h)\b/);
    if(m){ const hh=+m[1]; if(hh<24) return hh; }
    for(const bucket in TIME_KEYWORDS){
      if(TIME_KEYWORDS[bucket].some(w=>lower.includes(w))) return BUCKET_HOUR[bucket];
    }
    return null;
  }
  // capture hour of a photo, also covering older photos that only stored a coarse timeOfDay
  function photoHour(p){
    if(typeof p.captureHour === 'number') return p.captureHour;
    if(p.timeOfDay && BUCKET_HOUR[p.timeOfDay] != null) return BUCKET_HOUR[p.timeOfDay];
    return null;
  }
  // places each photo next to the text chunk whose mentioned time is closest to the photo's
  // capture time (within ~2 h). A photo whose time is known but far from every timed passage
  // goes into a chunk that mentions no time, so it never contradicts the text; photos with no
  // capture time at all fall back to an even round-robin.
  function distributePhotosToChunks(photos, chunks){
    const slots = chunks.map(()=>[]);
    const hours = chunks.map(chunkHour);
    const timedChunks = hours.map((h,i)=> h!=null ? i : -1).filter(i=>i>=0);
    const neutralChunks = hours.map((h,i)=> h==null ? i : -1).filter(i=>i>=0);
    const TOL = 2;

    const timed = [], untimed = [];
    photos.forEach(p=> (photoHour(p)!=null ? timed : untimed).push(p));
    timed.sort((a,b)=> photoHour(a) - photoHour(b));

    let neutralPtr = 0;
    timed.forEach(p=>{
      const ph = photoHour(p);
      let best = -1, bestDiff = Infinity;
      timedChunks.forEach(i=>{
        let d = Math.abs(hours[i] - ph);
        if(d > 12) d = 24 - d;
        if(d < bestDiff){ bestDiff = d; best = i; }
      });
      if(best >= 0 && bestDiff <= TOL) slots[best].push(p);
      else if(neutralChunks.length) slots[neutralChunks[neutralPtr++ % neutralChunks.length]].push(p);
      else if(best >= 0) slots[best].push(p);
      else slots[0].push(p);
    });

    const targets = neutralChunks.length ? neutralChunks : chunks.map((_,i)=>i);
    untimed.forEach((p,i)=> slots[targets[i % targets.length]].push(p));
    return slots;
  }

  function renderEntryCard(en){
    const photos = en.photos || [];
    const escaped = escapeHtml(en.text||'');
    const sentences = escaped.split(/(?<=[.!?])\s+/).filter(s=>s.trim());
    let bodyHtml = '';

    if(sentences.length===0){
      bodyHtml = `<p>${escaped}</p>`;
    } else if(photos.length===0){
      bodyHtml = escaped.split('\n\n').map(p=>`<p style="margin:0 0 12px;">${p.replace(/\n/g,'<br>')}</p>`).join('');
    } else {
      // group sentences into small chunks, then distribute photos evenly across the gaps between chunks
      const chunkSize = sentences.length <= 3 ? 1 : 2;
      const chunks = [];
      for(let i=0;i<sentences.length;i+=chunkSize) chunks.push(sentences.slice(i,i+chunkSize).join(' '));
      const slots = distributePhotosToChunks(photos, chunks);
      chunks.forEach((c,i)=>{
        bodyHtml += `<p style="margin:0 0 12px;">${c}</p>`;
        if(slots[i].length){
          bodyHtml += `<div class="inline-photos">` + slots[i].map(p=>
            `<img src="${p.data}" style="transform:rotate(${p.rotate||0}deg)">`
          ).join('') + `</div>`;
        }
      });
    }

    return `<div class="entry-card" id="entry-${en.id}">
      <div class="entry-head">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div class="stamp-badge">◆ ${fmtDate(en.date)}${en.weather?` ${weatherIcon(en.weather)}`:''}</div>
          ${en.stickers && en.stickers.length ? `<div class="entry-stickers">${en.stickers.join(' ')}</div>` : ''}
        </div>
        <div class="entry-actions">
          <button class="icon-btn" data-edit="${en.id}" title="Bearbeiten">✎</button>
          <button class="icon-btn" data-del-entry="${en.id}" title="Löschen">✕</button>
        </div>
      </div>
      <div class="entry-text">${bodyHtml}</div>
    </div>`;
  }

      state.formDate = en.date;
      state.formWeather = en.weather || '';
      state.formStickers = (en.stickers||[]).slice();
      CATEGORIES.forEach(c=> state.formFields[c.key] = en[c.key] || '');
      state.formCustomLabel = en.customLabel || ''; state.formCustomText = en.customText || '';
      state.formPhotos = (en.photos||[]).slice();
      state.formOriginalPhotoIds = state.formPhotos.map(p=>p.id);
      state.formGeneratedText = en.text || '';
    } else {
      const last = entries[entries.length-1];
      let nextDate = todayISO();
      if(last){ const d = new Date(last.date+'T00:00:00'); d.setDate(d.getDate()+1); nextDate = d.toISOString().slice(0,10); }
      state.formDate = nextDate;
      state.formWeather = '';
      state.formStickers = [];
      CATEGORIES.forEach(c=> state.formFields[c.key] = '');
      state.formCustomLabel=''; state.formCustomText='';
      state.formPhotos = []; state.formGeneratedText='';
      state.formOriginalPhotoIds = [];
    }
    state.view='form'; render();
  }

      state.view='trip'; render();
    });
  }

  // ---------- PDF export ----------
  async function exportTripPdf(trip){
    const statusEl = document.getElementById('export-status');
    const fmt = document.getElementById('export-format').value;
    let pageFormat = 'a4';
    if(fmt==='square') pageFormat = [210,210];
    if(fmt==='custom'){
      const wCm = parseFloat((document.getElementById('custom-w').value||'').replace(',','.'));
      const hCm = parseFloat((document.getElementById('custom-h').value||'').replace(',','.'));
      if(!wCm || !hCm || wCm<5 || hCm<5){
        alert('Bitte Breite und Höhe in cm angeben (mindestens 5 cm).');
        return;
      }
      pageFormat = [wCm*10, hCm*10];
    }
    statusEl.style.display='flex';
    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({unit:'mm', format: pageFormat});
      const pageW = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();
      const margin = 16;

      doc.setFont('times','bold'); doc.setFontSize(26);
      doc.text(trip.name, pageW/2, pageH/2 - 6, {align:'center'});
      doc.setFont('times','normal'); doc.setFontSize(11);
      doc.text('Reisetagebuch', pageW/2, pageH/2 + 4, {align:'center'});

      const entries = state.entries[trip.id] || [];
      for(const en of entries){
        doc.addPage();
        let y = margin;
        doc.setFont('times','bold'); doc.setFontSize(14);
        doc.text(fmtDate(en.date), margin, y);
        y += 8;
        doc.setDrawColor(180); doc.line(margin,y,pageW-margin,y);
        y += 8;
        doc.setFont('times','normal'); doc.setFontSize(11);
        const lines = doc.splitTextToSize(en.text || '', pageW-margin*2);
        doc.text(lines, margin, y);
        y += lines.length*5.2 + 8;

        if(en.photos && en.photos.length){
          const cols = en.photos.length===1?1:2;
          const gap = 4;
          const slotH = 55;
          const cellW = (pageW - margin*2 - gap*(cols-1)) / cols;
          for(let i=0;i<en.photos.length;i++){
            const p = en.photos[i];
            if(y + slotH > pageH - margin){ doc.addPage(); y = margin; }
            const col = i%cols;
            const cellX = margin + col*(cellW+gap);
            const ratio = (p.w && p.h) ? p.w/p.h : 1;
            // fit the image inside the cellW x slotH box without stretching (contain-fit), then center it
            let drawW = cellW, drawH = cellW/ratio;
            if(drawH > slotH){ drawH = slotH; drawW = slotH*ratio; }
            const offX = cellX + (cellW-drawW)/2;
            const offY = y + (slotH-drawH)/2;
            try{ doc.addImage(p.data,'JPEG', offX, offY, drawW, drawH); }catch(e){}
            if(col===cols-1 || i===en.photos.length-1){ y += slotH + gap; }
          }
        }
      }

      const geocoded = await getGeocodedPlaces(trip, (done,total)=>{
        statusEl.innerHTML = `<div class="spinner"></div>Orte für Karte werden gesucht … (${done}/${total})`;
      });
      doc.addPage();
      drawRouteMapOnPage(doc, trip.name, geocoded);

      doc.save(`${trip.name.replace(/[^a-z0-9äöüß_\- ]/gi,'')||'reisetagebuch'}.pdf`);
    }catch(e){
      console.error(e);
      alert('Der PDF-Export ist fehlgeschlagen. Bitte versuch es erneut.');
    }
    statusEl.style.display='none';
  }

  function importDataFromFile(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = async (ev)=>{
        try{
          const data = JSON.parse(ev.target.result);
          if(!data || !Array.isArray(data.trips)) throw new Error('Ungültiges Sicherungsformat');
          let tripsAdded = 0, entriesAdded = 0;
          data.trips.forEach(t=>{
            if(!state.trips.find(x=>x.id===t.id)){ state.trips.push(t); tripsAdded++; }
          });
          saveTrips();
          for(const tripId of Object.keys(data.entries || {})){
            if(!state.entries[tripId]) state.entries[tripId] = [];
            for(const en of (data.entries[tripId]||[])){
              if(state.entries[tripId].find(x=>x.id===en.id)) continue;
              for(const p of (en.photos||[])){
                if(!p.id) p.id = uid();
                if(p.data){ await photoPut(p.id, p.data); p._fromDb = true; }
              }
              state.entries[tripId].push(en);
              entriesAdded++;
            }
            state.entries[tripId].sort((a,b)=>a.date.localeCompare(b.date));
            await saveEntries(tripId);
          }
          resolve({trips: tripsAdded, entries: entriesAdded});
        }catch(e){ reject(e); }
      };
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }

  // ---------- map: geocoding + display of visited places ----------
  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
  function loadGeoCache(){ return storeGet('rtb_geocache_v4') || {}; }
  function saveGeoCache(c){ storeSet('rtb_geocache_v4', c); }
  function haversineKm(aLat,aLon,bLat,bLon){
    const R=6371, toRad=x=>x*Math.PI/180;
    const dLat=toRad(bLat-aLat), dLon=toRad(bLon-aLon);
    const s=Math.sin(dLat/2)**2 + Math.cos(toRad(aLat))*Math.cos(toRad(bLat))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(s));
  }

  function extractPlaces(trip){
    const entries = state.entries[trip.id] || [];
    const out = [];
    entries.forEach(en=>{
      const raw = en.orte || '';
      raw.split(/\n/).map(s=>s.trim()).filter(Boolean).forEach(place=>{
        out.push({place, date: en.date, entryId: en.id});
      });
    });
    return out;
  }

  async function geocodePlace(name, cache, hint){
    if(cache[name] !== undefined) return cache[name];
    try{
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=10&namedetails=1&addressdetails=1&accept-language=de&q=${encodeURIComponent(name)}`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      if(data && data.length){
        const best = pickBestGeocode(name, data, hint);
        if(best){
          const coords = {lat: parseFloat(best.lat), lon: parseFloat(best.lon), label: best.display_name || ''};
          cache[name] = coords;               // only successful hits are cached
          return coords;
        }
      }
      return null;                            // empty / unusable result — do NOT cache, retry next time
    }catch(e){
      console.error('Geocoding fehlgeschlagen für', name, e);
      return null;                            // transient error (rate limit, network) — do NOT cache
    }
  }

  // Nominatim frequently ranks natural features (peaks, ridges, streams) or far-away
  // same-named hamlets above the intended place — e.g. "Imst" the town vs. "Imstspitze"
  // the mountain. This scores all candidates so towns, villages, administrative areas and
  // alpine huts win over terrain features, an exact name match is strongly preferred, and
  // (when a hint centre from the rest of the trip is known) nearby candidates win ties.
  function pickBestGeocode(query, candidates, hint){
    const q = query.trim().toLowerCase();
    const core = new Set(['city','town','village','hamlet','municipality','borough']);
    const minor = new Set(['isolated_dwelling','croft','farm']);
    const urbanPart = new Set(['suburb','quarter','neighbourhood','city_block']);
    function namesOf(d){
      const nd = d.namedetails || {};
      return [d.name, nd.name, nd['name:de'], nd['name:en'], nd.official_name, nd.alt_name]
        .filter(Boolean).map(s=>String(s).toLowerCase());
    }
    function score(d){
      let s = 0;
      const cls = d.class, type = d.type;
      if(cls === 'place' && core.has(type)) s += 100;
      else if(cls === 'place' && urbanPart.has(type)) s += 70;
      else if(cls === 'place' && minor.has(type)) s += 45;
      else if(cls === 'place' && type === 'locality') s -= 25;   // OSM locality = named but UNpopulated spot ("mitten in der Landschaft")
      else if(cls === 'place') s += 30;                          // region, island …
      else if(cls === 'boundary' && type === 'administrative') s += 55;
      if(cls === 'tourism' && (type === 'alpine_hut' || type === 'wilderness_hut' || type === 'chalet')) s += 85;
      if(cls === 'amenity' && type === 'shelter') s += 25;
      if(cls === 'natural' || cls === 'mountain_range') s -= 60;  // peak, ridge, saddle, glacier …
      if(cls === 'waterway') s -= 45;
      const names = namesOf(d);
      if(names.includes(q)) s += 55;
      else if(names.some(n => n.startsWith(q + ' ') || n.startsWith(q + ','))) s += 20;
      else if(names.some(n => n.startsWith(q))) s += 8;
      s += (parseFloat(d.importance) || 0) * 12;
      const pr = parseFloat(d.place_rank);
      if(!isNaN(pr)) s += Math.max(0, 30 - pr) * 0.4;            // lower rank = more prominent unit
      if(hint){
        const dkm = haversineKm(hint.lat, hint.lon, parseFloat(d.lat), parseFloat(d.lon));
        s += Math.max(0, 45 - dkm/8);                           // +45 next door … 0 beyond ~360 km
      }
      return s;
    }
    let best = candidates[0], bestScore = -Infinity;
    for(const d of candidates){
      const sc = score(d);
      if(sc > bestScore){ bestScore = sc; best = d; }
    }
    return best;
  }

  // Resolves every place mentioned across a trip's entries to coordinates, using and updating
  // the shared cache. Used both by the on-screen map and by the PDF route-map export.
  async function getGeocodedPlaces(trip, onProgress){
    const places = extractPlaces(trip);
    if(places.length===0) return [];
    const cache = loadGeoCache();
    const result = [];
    for(let i=0;i<places.length;i++){
      const p = places[i];
      const wasCached = cache[p.place] !== undefined;
      // rough centre of the places already resolved for this trip — used to break ties
      // toward the region actually being travelled, not a same-named spot elsewhere
      const hint = result.length ? {
        lat: result.reduce((a,r)=>a+r.lat,0)/result.length,
        lon: result.reduce((a,r)=>a+r.lon,0)/result.length
      } : null;
      const coords = await geocodePlace(p.place, cache, hint);
      if(onProgress) onProgress(i+1, places.length);
      if(coords) result.push(Object.assign({}, p, coords));
      if(!wasCached) await sleep(1100); // Nominatim: max ~1 Anfrage/Sekunde
    }
    saveGeoCache(cache);
    return result;
  }

  let currentLeafletMap = null;

  // long press (touch) / right-click (desktop) on the map: reverse-geocode the spot and
  // let the user add it directly as a place, attached to one of the trip's diary entries.
  function attachLongPressAddPlace(map, trip){
    map.on('contextmenu', async function(e){
      if(e.originalEvent) e.originalEvent.preventDefault();
      const entries = state.entries[trip.id] || [];
      if(entries.length===0){
        alert('Leg zuerst einen Reisetag an, bevor du Orte auf der Karte markierst.');
        return;
      }
      const lat = e.latlng.lat, lon = e.latlng.lng;
      const popup = L.popup({maxWidth:260}).setLatLng(e.latlng)
        .setContent('<div class="loading-row"><div class="spinner"></div>Ort wird ermittelt …</div>')
        .openOn(map);

      let suggested = '';
      try{
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=de&zoom=14`;
        const res = await fetch(url);
        const data = await res.json();
        const addr = data.address || {};
        suggested = addr.village || addr.town || addr.city || addr.municipality || addr.hamlet || addr.suburb
          || (data.display_name ? data.display_name.split(',')[0] : '') || '';
      }catch(err){ console.error('Reverse-Geocoding fehlgeschlagen', err); }

      const uidStr = uid();
      const optionsHtml = entries.map(en=>`<option value="${en.id}">${fmtDate(en.date)}</option>`).join('');
      popup.setContent(`<div style="min-width:190px;">
        <label style="margin-bottom:4px;">Ort</label>
        <input type="text" id="lp-name-${uidStr}" value="${escapeHtml(suggested)}" style="margin-bottom:8px;">
        <label style="margin-bottom:4px;">Tag</label>
        <select id="lp-day-${uidStr}" style="margin-bottom:8px;">${optionsHtml}</select>
        <button class="btn small" id="lp-add-${uidStr}" style="width:100%;">Ort hinzufügen</button>
      </div>`);

      const daySel = document.getElementById('lp-day-'+uidStr);
      if(daySel) daySel.value = entries[entries.length-1].id;
      const addBtn = document.getElementById('lp-add-'+uidStr);
      if(addBtn) addBtn.addEventListener('click', ()=>{
        const nameInput = document.getElementById('lp-name-'+uidStr);
        const name = nameInput.value.trim();
        if(!name){ nameInput.focus(); return; }
        const entryId = document.getElementById('lp-day-'+uidStr).value;
        const list = state.entries[trip.id];
        const en = list.find(x=>x.id===entryId);
        en.orte = (en.orte && en.orte.trim()) ? en.orte.trim()+'\n'+name : name;
        saveEntries(trip.id);

        const cache = loadGeoCache();
        cache[name] = {lat, lon, label: suggested || name};
        saveGeoCache(cache);

        map.closePopup(popup);
        const marker = L.marker([lat,lon]).addTo(map);
        marker.bindPopup(`<b>${fmtDateShort(en.date)}</b><br>${escapeHtml(name)}`);
        const statusEl = document.getElementById('map-status');
        if(statusEl) statusEl.innerHTML = `Ort „${escapeHtml(name)}“ zu ${fmtDate(en.date)} hinzugefügt.`;
      });
    });
  }

  async function showTripMap(trip){

    const overlay = document.createElement('div');
    overlay.className = 'map-overlay';
    overlay.innerHTML = `
      <div class="map-overlay-head">
        <h3 style="font-size:17px;">${escapeHtml(trip.name)} — Karte</h3>
        <div style="display:flex;gap:6px;">

          <button class="icon-btn" id="close-map-btn">✕</button>
        </div>
      </div>
      <div id="trip-map"></div>
      <div class="loading-row" id="map-status" style="justify-content:center;padding:10px;"><div class="spinner"></div>Orte werden auf der Karte gesucht …</div>
      <div class="hint" style="text-align:center;margin:0 16px 10px;">Tipp: Karte gedrückt halten (bzw. rechte Maustaste), um einen Ort direkt hier zu markieren.</div>

    document.getElementById('export-map-btn').addEventListener('click', (e)=> exportMapPdf(trip, e.target));

    const map = L.map('trip-map').setView([47.4, 10.9], 7);
    currentLeafletMap = map;
    const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap-Mitwirkende, SRTM | © OpenTopoMap (CC-BY-SA)',
      maxZoom: 17
    });
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap-Mitwirkende',
      maxZoom: 19
    });
    topoLayer.addTo(map);
    L.control.layers({'Gelände (OpenTopoMap)': topoLayer, 'Standard (OpenStreetMap)': osmLayer}, null, {collapsed:false}).addTo(map);

    attachLongPressAddPlace(map, trip);

    if(places.length===0){
      document.getElementById('map-status').innerHTML = 'Keine Orte in "Besuchte Orte" eingetragen. Trag pro Zeile einen Ort ein, oder halte die Karte gedrückt (bzw. rechte Maustaste), um einen Ort direkt hier zu markieren.';
      return;
    }

    const statusEl = document.getElementById('map-status');
    const geocoded = await getGeocodedPlaces(trip, (done,total)=>{
      statusEl.innerHTML = `<div class="spinner"></div>Orte werden gesucht … (${done}/${total})`;
    });
    const markers = geocoded.map(p=>{
      const marker = L.marker([p.lat, p.lon]).addTo(map);
      marker.bindPopup(`<b>${fmtDateShort(p.date)}</b><br>${escapeHtml(p.place)}${p.label?`<br><span style="color:#6b6354;font-size:11px;">${escapeHtml(p.label)}</span>`:''}`);
      return marker;
    });

    if(markers.length>0){
      const group = L.featureGroup(markers);
      map.fitBounds(group.getBounds().pad(0.2));
    }
    const foundNames = new Set(geocoded.map(g=>g.place));
    const missing = [...new Set(places.map(p=>p.place).filter(n=>!foundNames.has(n)))];
    statusEl.innerHTML = geocoded.length>0
      ? `${geocoded.length} von ${places.length} Ort(en) gefunden.` + (missing.length?` Nicht gefunden: ${escapeHtml(missing.join(', '))} — Region ergänzen, z. B. „${escapeHtml(missing[0])}, Tirol“.`:'')
      : `Keine der eingetragenen Orte konnten gefunden werden. Prüf die Schreibweise oder ergänze die Region (z. B. „Imst, Tirol“).`;
    setTimeout(()=>{ if(statusEl) statusEl.style.opacity='0.6'; }, 3000);
  }

  // draws a schematic route map (points + connecting line, chronological order) onto the CURRENT page of doc
  function drawRouteMapOnPage(doc, tripName, places){
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 16;
    doc.setFont('times','bold'); doc.setFontSize(16);
    doc.text('Reiseroute', margin, margin + 2);
    doc.setFont('times','normal'); doc.setFontSize(9);
    doc.setTextColor(120,120,120);
    doc.text(tripName, margin, margin + 8);
    doc.setTextColor(0,0,0);

    const areaX = margin, areaY = margin + 14, areaW = pageW - margin*2, areaH = pageH - margin*2 - 18;
    doc.setDrawColor(200);
    doc.rect(areaX, areaY, areaW, areaH);

    if(!places || places.length===0){
      doc.setFontSize(10);
      doc.text('Keine Orte gefunden. Trag pro Zeile einen Ort bei "Besuchte Orte" ein.', areaX+6, areaY+12);
      return;
    }

    let minLat = Math.min(...places.map(p=>p.lat)), maxLat = Math.max(...places.map(p=>p.lat));
    let minLon = Math.min(...places.map(p=>p.lon)), maxLon = Math.max(...places.map(p=>p.lon));
    const latSpan = Math.max(maxLat-minLat, 0.02), lonSpan = Math.max(maxLon-minLon, 0.02);
    const pad = 0.15;
    minLat -= latSpan*pad; maxLat += latSpan*pad;
    minLon -= lonSpan*pad; maxLon += lonSpan*pad;

    function project(lat, lon){
      const x = areaX + ((lon-minLon)/(maxLon-minLon)) * areaW;
      const y = areaY + ((maxLat-lat)/(maxLat-minLat)) * areaH; // flip: latitude increases upward, PDF y increases downward
      return [x,y];
    }

    // connecting line in chronological order
    doc.setDrawColor(147,164,178);
    try{ doc.setLineDashPattern([1.2,1], 0); }catch(e){}
    for(let i=0;i<places.length-1;i++){
      const [x1,y1] = project(places[i].lat, places[i].lon);
      const [x2,y2] = project(places[i+1].lat, places[i+1].lon);
      doc.line(x1,y1,x2,y2);
    }
    try{ doc.setLineDashPattern([], 0); }catch(e){}

    // markers + numbered labels
    doc.setFontSize(8);
    places.forEach((p,i)=>{
      const [x,y] = project(p.lat, p.lon);
      doc.setFillColor(51,71,91);
      doc.circle(x, y, 1.6, 'F');
      doc.setTextColor(43,38,32);
      doc.text(`${i+1}. ${p.place}`, x+2.6, y+1);
    });
    doc.setTextColor(0,0,0);

    // legend
    doc.setFontSize(8);
    doc.setTextColor(120,120,120);
    doc.text('Kartendarstellung: schematisch (kein exakter Maßstab). Quelle Ortssuche: OpenStreetMap/Nominatim.', areaX, areaY+areaH+6);
    doc.setTextColor(0,0,0);
  }

  async function exportMapPdf(trip, triggerEl){
    const originalLabel = triggerEl ? triggerEl.textContent : '';
    if(triggerEl){ triggerEl.disabled = true; triggerEl.textContent = 'Orte werden gesucht …'; }
    try{
      const geocoded = await getGeocodedPlaces(trip, (done,total)=>{
        if(triggerEl) triggerEl.textContent = `Orte werden gesucht … (${done}/${total})`;
      });
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({unit:'mm', format:'a4'});
      drawRouteMapOnPage(doc, trip.name, geocoded);
      doc.save(`${trip.name.replace(/[^a-z0-9äöüß_\- ]/gi,'')||'reisetagebuch'}-karte.pdf`);
    }catch(e){
      console.error(e);
      alert('Der Karten-Export ist fehlgeschlagen. Bitte versuch es erneut.');
    }
    if(triggerEl){ triggerEl.disabled = false; triggerEl.textContent = originalLabel; }
  }

  // ---------- init ----------
  async function init(){
    if(typeof(Storage)==="undefined"){
      app.innerHTML = `<div class="empty"><div class="glyph">⚠️</div>Dein Browser unterstützt keinen lokalen Speicher (localStorage). Die App kann so keine Daten dauerhaft speichern.</div>`;
      return;
    }
    loadApiKey();
    loadTrips();
    for(const t of state.trips){
      await loadEntries(t.id);
      // one-time migration: photos still stored inline (from before IndexedDB support) get moved
      // out of localStorage as soon as we see them, freeing up the tight localStorage quota.
      const needsMigration = (state.entries[t.id]||[]).some(en=>(en.photos||[]).some(p=>p.data && !p._fromDb));
      if(needsMigration) await saveEntries(t.id);
    }
    render();
  }
  init();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(e=> console.warn('Service Worker Registrierung fehlgeschlagen:', e));
    });
  }
})();
</script>
